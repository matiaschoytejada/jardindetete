name: Avisos de Ciruquis

# Horas en UTC; Lima es UTC-5. Cada turno se programa 10 minutos antes
# porque GitHub suele atrasar las tareas programadas.
on:
  schedule:
    - cron: "50 16 * * *"  # 12:00 p. m. Lima (riego viernes a domingo)
    - cron: "50 21 * * *"  # 5:00 p. m. Lima (riego viernes a domingo)
    - cron: "50 23 * * *"  # 7:00 p. m. Lima (riego lunes a jueves + recordatorios del día)
    - cron: "50 0 * * *"   # 8:00 p. m. Lima (último recordatorio de riego, todos los días)
    - cron: "*/15 * * * *" # cada 15 minutos: mensajitos nuevos
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué aviso correr"
        type: choice
        default: prueba
        options: [prueba, recordatorio, mensajes]
      turno:
        description: "Turno (hora de Lima) para modo recordatorio"
        type: choice
        default: "19"
        options: ["12", "17", "19", "20"]

permissions:
  contents: write

concurrency:
  group: avisos-${{ github.event.schedule || inputs.modo }}
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: notify
      - run: node notify/index.mjs
        env:
          TZ: America/Lima
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MODE: ${{ inputs.modo || (github.event.schedule == '*/15 * * * *' && 'mensajes') || 'recordatorio' }}
          SLOT: ${{ inputs.turno || (github.event.schedule == '50 16 * * *' && '12') || (github.event.schedule == '50 21 * * *' && '17') || (github.event.schedule == '50 0 * * *' && '20') || '19' }}
      # GitHub pausa las tareas programadas tras 60 días sin cambios en el repo.
      # Un latido mensual las mantiene vivas.
      - name: Latido mensual
        if: github.event_name == 'schedule' && github.event.schedule == '50 23 * * *'
        env:
          TZ: America/Lima
        run: |
          if [ "$(date +%d)" = "01" ]; then
            date -Iseconds > notify/latido.txt
            git config user.name "Ciruquis"
            git config user.email "ciruquis@users.noreply.github.com"
            git add notify/latido.txt
            git commit -m "Latido mensual de Ciruquis" && git push
          fi
